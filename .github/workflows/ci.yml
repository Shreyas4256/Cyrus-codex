name: Cyrus CPU checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ml.lock
      - name: Install portable dependencies
        run: python -m pip install -r requirements.lock
      - name: Install CPU PyTorch
        run: >-
          python -m pip install -r requirements-ml.lock
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install Cyrus
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Compile
        run: python -m compileall -q cyrus tests scripts
      - name: Test
        run: python -m unittest discover -s tests -v

